name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.7"
      - uses: actions/configure-pages@v6.0.0
      - run: uv sync --locked
      - run: uv run --locked shimstacker plan src/shimstacker/examples/feasible-shop.json --output site
      - run: cp site/report.html site/index.html
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.0
