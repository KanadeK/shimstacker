[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "shimstacker"
version = "0.1.0"
description = "Exact offline allocation of finite shim stock with worst-case tolerance proof"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "KanadeK" }]
keywords = ["shim", "tolerance", "inventory", "solver", "manufacturing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "coverage==7.10.6",
  "mypy==1.17.1",
  "pytest==8.4.2",
  "ruff==0.12.12",
]

[project.scripts]
shimstacker = "shimstacker.cli:main"

[project.urls]
Homepage = "https://github.com/KanadeK/shimstacker"
Issues = "https://github.com/KanadeK/shimstacker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/shimstacker"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["shimstacker"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
strict = true
packages = ["shimstacker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D213", "EM101", "EM102", "TC003", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "D", "PLR2004", "S101"]
